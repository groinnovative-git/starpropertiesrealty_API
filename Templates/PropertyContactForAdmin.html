<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Visit Request</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:0; background-color:#f6f1e8; font-family:'Poppins', Arial, Helvetica, sans-serif; color:#1b1b1b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f6f1e8; margin:0; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="680" cellspacing="0" cellpadding="0" border="0" style="width:680px; max-width:680px; background:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 10px 35px rgba(0,0,0,0.10);">

                    <tr>
                        <td style="background:#174f3d; padding:20px; text-align:center;">

                            <!-- TEXT LOGO -->
                            <h1 style="color: #d4af37; margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 1px;">
                                StarPropertiesAndRealty
                            </h1>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding:30px;">
                            <div style="background:#fff8e7; border:1px solid #ecdba3; border-radius:12px; padding:18px; margin-bottom:20px;">
                                <p style="margin:0; font-size:12px; font-weight:600; color:#8a6a12; text-transform:uppercase; letter-spacing:1px;">Property Name</p>
                                <p style="margin:8px 0 0; font-size:20px; color:#174f3d; font-weight:700;">{{propertyName}}</p>
                            </div>

                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="padding-bottom:16px;">
                                        <p style="margin:0; font-size:12px; font-weight:600; color:#7b7b7b; text-transform:uppercase; letter-spacing:1px;">Customer Name</p>
                                        <p style="margin:6px 0 0; font-size:16px; color:#111827; font-weight:500;">{{fullName}}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-bottom:16px;">
                                        <p style="margin:0; font-size:12px; font-weight:600; color:#7b7b7b; text-transform:uppercase; letter-spacing:1px;">Email Address</p>
                                        <p style="margin:6px 0 0; font-size:16px; color:#111827; font-weight:500;">{{email}}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-bottom:16px;">
                                        <p style="margin:0; font-size:12px; font-weight:600; color:#7b7b7b; text-transform:uppercase; letter-spacing:1px;">Phone Number</p>
                                        <p style="margin:6px 0 0; font-size:16px; color:#111827; font-weight:500;">{{phone}}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-bottom:16px;">
                                        <p style="margin:0; font-size:12px; font-weight:600; color:#7b7b7b; text-transform:uppercase; letter-spacing:1px;">Visit Date</p>
                                        <p style="margin:6px 0 0; font-size:16px; color:#111827; font-weight:500;">{{visitDate}}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <p style="margin:0 0 8px; font-size:12px; font-weight:600; color:#7b7b7b; text-transform:uppercase; letter-spacing:1px;">Message</p>
                                        <div style="background:#faf8f3; border:1px solid #ece7dc; border-radius:12px; padding:18px; font-size:15px; line-height:24px; color:#374151;">
                                            {{message}}
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 30px 28px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                                <tr>
                                    <td style="background:#d4af37; border-radius:10px;">
                                        <a href="mailto:{{email}}" style="display:inline-block; padding:14px 26px; color:#ffffff; text-decoration:none; font-size:15px; font-weight:600; font-family:'Poppins', Arial, Helvetica, sans-serif;">
                                            Reply to Customer
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="background:#f8f8f8; border-top:1px solid #ececec; padding:18px 30px; text-align:center;">
                            <p style="margin:0; font-size:12px; line-height:20px; color:#6b7280;">
                                StarPropertiesAndRealty • Your Dream, Our Mission
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
